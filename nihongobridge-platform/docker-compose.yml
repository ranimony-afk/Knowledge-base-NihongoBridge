name: nihongobridge

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d nihongobridge_dev
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [nihongobridge]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [nihongobridge]

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-local-meilisearch-master-key-change-me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:7700/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [nihongobridge]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [nihongobridge]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_AUDIO_BUCKET: ${MINIO_AUDIO_BUCKET:-audio}
      MINIO_IMAGES_BUCKET: ${MINIO_IMAGES_BUCKET:-images}
      MINIO_SVGS_BUCKET: ${MINIO_SVGS_BUCKET:-svgs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        for bucket in "$${MINIO_AUDIO_BUCKET}" "$${MINIO_IMAGES_BUCKET}" "$${MINIO_SVGS_BUCKET}"; do
          mc mb --ignore-existing "local/$${bucket}"
          mc anonymous set download "local/$${bucket}"
        done
    restart: "no"
    networks: [nihongobridge]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    command: ["-storage=maildir", "-maildir-path=/maildir"]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    volumes:
      - mailhog_data:/maildir
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8025
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks: [nihongobridge]

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    volumes:
      - adminer_data:/var/lib/adminer
    healthcheck:
      test:
        - CMD-SHELL
        - php -r '$$socket=@fsockopen("127.0.0.1",8080); exit($$socket ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    networks: [nihongobridge]

volumes:
  postgres_data:
    name: nihongobridge_postgres_data
  redis_data:
    name: nihongobridge_redis_data
  meilisearch_data:
    name: nihongobridge_meilisearch_data
  minio_data:
    name: nihongobridge_minio_data
  mailhog_data:
    name: nihongobridge_mailhog_data
  adminer_data:
    name: nihongobridge_adminer_data

networks:
  nihongobridge:
    name: nihongobridge_dev
    driver: bridge
