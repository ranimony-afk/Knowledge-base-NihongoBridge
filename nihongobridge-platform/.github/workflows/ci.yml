name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: test

jobs:
  lint:
    name: Lint · ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: knowledge, runtime: node }
          - { component: api, runtime: node }
          - { component: web, runtime: node }
          - { component: admin, runtime: node }
          - { component: search, runtime: node }
          - { component: ai, runtime: node }
          - { component: etl, runtime: python }
          - { component: mobile, runtime: flutter }
    steps:
      - name: Checkout platform
        uses: actions/checkout@v4
      - name: Checkout component
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-${{ matrix.component }}
          path: components/nihongobridge-${{ matrix.component }}
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Checkout shared knowledge package
        if: matrix.runtime == 'node' && matrix.component != 'knowledge'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-knowledge
          path: components/nihongobridge-knowledge
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: components/nihongobridge-${{ matrix.component }}/package-lock.json
      - name: Lint Node component
        if: matrix.runtime == 'node'
        working-directory: components/nihongobridge-${{ matrix.component }}
        run: |
          npm ci
          npm run lint --if-present

      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/nihongobridge-etl/requirements-dev.txt
      - name: Lint ETL
        if: matrix.runtime == 'python'
        working-directory: components/nihongobridge-etl
        run: |
          python -m pip install -r requirements-dev.txt
          ruff format --check .
          ruff check .

      - name: Set up Flutter
        if: matrix.runtime == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Check mobile formatting
        if: matrix.runtime == 'flutter'
        working-directory: components/nihongobridge-mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test

      - name: Validate platform scripts and Compose
        if: matrix.component == 'knowledge'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh tests/*.sh docker/postgres/init/*.sh
          ./tests/platform_test.sh

  typecheck:
    name: Typecheck · ${{ matrix.component }} · Node ${{ matrix.node || 'n/a' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: knowledge, runtime: node, node: 20.x }
          - { component: api, runtime: node, node: 20.x }
          - { component: web, runtime: node, node: 20.x }
          - { component: admin, runtime: node, node: 20.x }
          - { component: search, runtime: node, node: 20.x }
          - { component: ai, runtime: node, node: 20.x }
          - { component: etl, runtime: python }
          - { component: mobile, runtime: flutter }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout component
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-${{ matrix.component }}
          path: components/nihongobridge-${{ matrix.component }}
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Checkout shared knowledge package
        if: matrix.runtime == 'node' && matrix.component != 'knowledge'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-knowledge
          path: components/nihongobridge-knowledge
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: components/nihongobridge-${{ matrix.component }}/package-lock.json
      - name: Strict TypeScript
        if: matrix.runtime == 'node'
        working-directory: components/nihongobridge-${{ matrix.component }}
        run: |
          npm ci
          npm run typecheck
          npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/nihongobridge-etl/requirements-dev.txt
      - name: Strict Python typing
        if: matrix.runtime == 'python'
        working-directory: components/nihongobridge-etl
        run: |
          python -m pip install -r requirements-dev.txt
          mypy etl
      - name: Set up Flutter
        if: matrix.runtime == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Analyze Flutter
        if: matrix.runtime == 'flutter'
        working-directory: components/nihongobridge-mobile
        run: |
          flutter pub get
          flutter analyze

  test:
    name: Unit tests · ${{ matrix.component }} · Node ${{ matrix.node || 'n/a' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: knowledge, runtime: node, node: 20.x }
          - { component: api, runtime: node, node: 20.x }
          - { component: web, runtime: node, node: 20.x }
          - { component: admin, runtime: node, node: 20.x }
          - { component: search, runtime: node, node: 20.x }
          - { component: ai, runtime: node, node: 20.x }
          - { component: etl, runtime: python }
          - { component: mobile, runtime: flutter }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout component
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-${{ matrix.component }}
          path: components/nihongobridge-${{ matrix.component }}
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Checkout shared knowledge package
        if: matrix.runtime == 'node' && matrix.component != 'knowledge'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-knowledge
          path: components/nihongobridge-knowledge
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: components/nihongobridge-${{ matrix.component }}/package-lock.json
      - name: Run Node unit tests
        if: matrix.runtime == 'node'
        working-directory: components/nihongobridge-${{ matrix.component }}
        run: |
          npm ci
          npm test --if-present
      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/nihongobridge-etl/requirements-dev.txt
      - name: Run ETL unit tests
        if: matrix.runtime == 'python'
        working-directory: components/nihongobridge-etl
        run: |
          python -m pip install -r requirements-dev.txt
          pytest
      - name: Set up Flutter
        if: matrix.runtime == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Run Flutter tests
        if: matrix.runtime == 'flutter'
        working-directory: components/nihongobridge-mobile
        run: |
          flutter pub get
          flutter test

  integration:
    name: PostgreSQL · Meilisearch · MinIO integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Checkout knowledge
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-knowledge
          path: components/nihongobridge-knowledge
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Checkout search
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-search
          path: components/nihongobridge-search
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Start dependencies
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 180 postgres redis meilisearch minio
          docker compose run --rm minio-init
      - name: Install integration dependencies
        run: |
          npm ci --prefix components/nihongobridge-knowledge
          npm ci --prefix components/nihongobridge-search
      - name: Migrate, seed, configure, and synchronize
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nihongobridge_dev
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_KEY: local-meilisearch-master-key-change-me
          MEILI_MASTER_KEY: local-meilisearch-master-key-change-me
          COMPONENT_ROOT: ${{ github.workspace }}/components
        run: |
          npm run db:migrate --prefix components/nihongobridge-knowledge
          npm run seed:n5 --prefix components/nihongobridge-knowledge
          ./scripts/sync-search.sh
      - name: Verify service integration
        run: |
          test "$(docker compose exec -T postgres psql -U postgres -d nihongobridge_dev -Atc 'select count(*) from dictionary_entries')" -ge 5
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
          curl --fail --silent -H 'Authorization: Bearer local-meilisearch-master-key-change-me' http://localhost:7700/indexes/dictionary >/dev/null
          curl --fail --silent http://localhost:9000/minio/health/ready >/dev/null
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop dependencies
        if: always()
        run: docker compose down --volumes --remove-orphans

  build:
    name: Build · ${{ matrix.component }} · Node ${{ matrix.node || 'n/a' }}
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: knowledge, runtime: node, node: 20.x }
          - { component: api, runtime: node, node: 20.x }
          - { component: web, runtime: node, node: 20.x }
          - { component: admin, runtime: node, node: 20.x }
          - { component: search, runtime: node, node: 20.x }
          - { component: ai, runtime: node, node: 20.x }
          - { component: etl, runtime: python }
          - { component: mobile, runtime: flutter }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout component
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-${{ matrix.component }}
          path: components/nihongobridge-${{ matrix.component }}
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Checkout shared knowledge package
        if: matrix.runtime == 'node' && matrix.component != 'knowledge'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nihongobridge-knowledge
          path: components/nihongobridge-knowledge
          token: ${{ secrets.PLATFORM_REPOS_TOKEN || github.token }}
      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: components/nihongobridge-${{ matrix.component }}/package-lock.json
      - name: Build Node component
        if: matrix.runtime == 'node'
        working-directory: components/nihongobridge-${{ matrix.component }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          if [ "${{ matrix.component }}" = knowledge ]; then
            npm run build:package
          else
            npm run build
          fi
      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: components/nihongobridge-etl/requirements.txt
      - name: Build ETL package
        if: matrix.runtime == 'python'
        working-directory: components/nihongobridge-etl
        run: |
          python -m pip install build
          python -m build
      - name: Set up Java
        if: matrix.runtime == 'flutter'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        if: matrix.runtime == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Build Android debug APK
        if: matrix.runtime == 'flutter'
        working-directory: components/nihongobridge-mobile
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Upload Android artifact
        if: matrix.runtime == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: nihongobridge-mobile-debug
          path: components/nihongobridge-mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
