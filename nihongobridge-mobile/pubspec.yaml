name: nihongobridge_mobile
description: NihongoBridge Japanese learning mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  flutter_animate: ^4.5.2
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  path: ^1.9.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
